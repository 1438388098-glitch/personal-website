name = "edge-cache"
main = "worker.js"
compatibility_date = "2026-10-07"
# account_id 不入库：部署时用环境变量 CLOUDFLARE_ACCOUNT_ID 或
# `wrangler deploy --account-id <id>` 传入。它不是凭据，但没必要把账号标识
# 写进仓库——公开仓库里少一个可被枚举的稳定标识。

# 只绑裸域：www 已由源站 301 到裸域，不参与缓存
routes = [
  { pattern = "iweistoicqc5.top/*", zone_name = "iweistoicqc5.top" }
]
