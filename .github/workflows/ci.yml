name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 每日一跑：定时发布（pubDate <= now 过滤）的文章靠每日构建在到日当天自动上线
  schedule:
    - cron: '0 0 * * *'

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run check:links
      - run: npm run check:secrets
