name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 每日一跑：定时发布（pubDate <= now 过滤）的文章到日当天由构建验证可正常产出。
  # 注意：本 workflow 只验证不部署，站点上线由站主手动构建发布；
  # cron 为 UTC 时间，0 0 对应北京时间 08:00，此前一天的文章在该时刻后才会被纳入。
  schedule:
    - cron: '0 0 * * *'

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run check:links
      - run: npm run check:secrets
