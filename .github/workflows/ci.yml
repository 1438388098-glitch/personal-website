name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  # 每日一跑：定时发布（pubDate <= now 过滤）的文章到日当天由构建验证可正常产出。
  # 注意：本 workflow 只验证不部署，站点上线由站主手动构建发布；
  # cron 为 UTC 时间，0 0 对应北京时间 08:00，此前一天的文章在该时刻后才会被纳入。
  schedule:
    - cron: '0 0 * * *'

# 最小权限：构建与检查只需读代码
permissions:
  contents: read
# 同分支并发跑只保留最新一次（cron 与 push 撞车时不白跑）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # scripts/*.mjs 游离于 astro check 与 vitest 之外，语法错在这里当天暴露
      - run: status=0; for f in scripts/*.mjs; do node --check "$f" || status=1; done; test "$status" -eq 0
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run check:dist
      - run: npm run check:links
      - run: npm run check:secrets
      - run: npm run check:style
      - run: npm run check:content
      # scripts/*.mjs 的 JSDoc 类型检查（tsconfig.scripts.json，无需构建产物）
      - run: npm run check:scripts

  # 只在定时任务触发：依赖漏洞雷达与外链探活都依赖外网，上游抖动不该阻塞 PR。
  # continue-on-error 显式为 false（允许阻断），但因 job 仅 schedule 触发，PR/push 不受影响。
  scheduled-audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:audit
      # check:extlinks 扫 dist 产物里的站外链接，需先构建
      - run: npm run build
      - run: npm run check:extlinks
